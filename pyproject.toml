[project]
name = "ndis-assistant"
version = "0.2.1"
description = "NDIS knowledge base MCP server for Australian disability support"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

